# docker compose up --build                       api + MCP servers + qdrant
# docker compose --profile ingest run --rm ingest  fetch + index the docs (once)
# docker compose --profile otel up                 adds Jaeger for traces (UI on :16686)
x-app: &app
  build: .
  image: mcp-agent-gateway:local
  env_file: .env
  volumes:
    - model-cache:/cache

services:
  qdrant:
    image: qdrant/qdrant:latest  # pin a version for real deployments
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20

  retrieval-mcp:
    <<: *app
    command: ["python", "-m", "mcp_servers.retrieval.server"]
    environment:
      RETRIEVAL_QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/healthz"]
      interval: 5s
      retries: 20

  tickets-mcp:
    <<: *app
    command: ["python", "-m", "mcp_servers.tickets.server"]
    environment:
      TICKETS_DB_PATH: /app/data/tickets.db
    volumes:
      - tickets-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8102/healthz"]
      interval: 5s
      retries: 20

  api:
    <<: *app
    ports: ["8000:8000"]
    environment:
      RETRIEVAL_MCP_URL: http://retrieval-mcp:8101/mcp
      TICKETS_MCP_URL: http://tickets-mcp:8102/mcp
      GW_DATABASE_URL: sqlite+aiosqlite:////app/data/gateway.db
    volumes:
      - gateway-data:/app/data
    depends_on:
      retrieval-mcp: {condition: service_healthy}
      tickets-mcp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      retries: 20

  ingest:
    <<: *app
    profiles: ["ingest"]
    command: ["sh", "-c", "python -m ingest.fetch --dest data/corpus && python -m ingest.run --corpus data/corpus"]
    environment:
      RETRIEVAL_QDRANT_URL: http://qdrant:6333
    volumes:
      - model-cache:/cache
      - corpus:/app/data
    depends_on:
      qdrant: {condition: service_healthy}

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["otel"]
    ports: ["16686:16686", "4318:4318"]

volumes:
  qdrant-data:
  tickets-data:
  gateway-data:
  model-cache:
  corpus:
