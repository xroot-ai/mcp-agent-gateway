# Minimum pass rates. evals/run.py exits non-zero if any suite falls below its bar.
rag:
  answer_correct: 0.80     # judge says the answer matches the expected facts
  grounded: 0.85           # judge says claims are supported by the cited sources
  cites_expected_source: 0.70
multiturn:
  answer_correct: 0.75
guardrails:
  accuracy: 0.95           # allowed/blocked decision matches
  false_block_rate_max: 0.10
